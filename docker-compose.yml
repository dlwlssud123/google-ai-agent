version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/chroma_db
    environment:
      - IS_PERSISTENT=TRUE
      - PERSISTENT_DIRECTORY=/chroma_db
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=*
    restart: always

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs_app
    ports:
      - "3000:3000"
    environment:
      - CHROMADB_URL=http://chromadb:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - chromadb
    volumes:
      - ./data:/app/data
    restart: always

